# ============================================
# HTTP → HTTPS redirect + Certbot challenge
# ============================================
server {
    listen 80;
    server_name lajespintadas.rn.gov.br www.lajespintadas.rn.gov.br;

    # Certbot ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirecionar tudo para HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ============================================
# HTTPS — Servidor principal
# ============================================
server {
    listen 443 ssl http2;
    server_name lajespintadas.rn.gov.br www.lajespintadas.rn.gov.br;

    # ---- Certificados SSL (Let's Encrypt) ----
    ssl_certificate     /etc/letsencrypt/live/lajespintadas.rn.gov.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lajespintadas.rn.gov.br/privkey.pem;

    # ---- Configurações SSL recomendadas ----
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ---- Headers de Segurança ----
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 50M;

    # ---- Proxy para Next.js ----
    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ---- Cache de assets estáticos ----
    location /_next/static {
        proxy_pass http://web:3000;
        proxy_cache_bypass $http_upgrade;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /public {
        proxy_pass http://web:3000;
        add_header Cache-Control "public, max-age=86400";
    }

    # ---- Favicon e robots ----
    location = /favicon.ico {
        proxy_pass http://web:3000;
        access_log off;
        log_not_found off;
    }
}
