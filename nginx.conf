# Redireciona HTTP → HTTPS
server {
    listen 80;
    server_name lajespintadas.rn.gov.br www.lajespintadas.rn.gov.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS principal
server {
    listen 443 ssl;
    server_name lajespintadas.rn.gov.br www.lajespintadas.rn.gov.br;

    ssl_certificate     /etc/letsencrypt/live/lajespintadas.rn.gov.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lajespintadas.rn.gov.br/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 50M;

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location /_next/static {
        proxy_pass http://web:3000;
        proxy_cache_bypass $http_upgrade;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /public {
        proxy_pass http://web:3000;
        add_header Cache-Control "public, max-age=86400";
    }
}
