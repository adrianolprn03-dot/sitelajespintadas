# ==============================================================================
# Configuração Nginx Reverse Proxy para Next.js 14 Standalone
# Portal Oficial Lajes Pintadas / HostGator VPS
# ==============================================================================

server {
    listen 80;
    server_name _;

    # Desafio Let's Encrypt / Certbot para renovação de SSL
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Cabeçalhos de Segurança
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Limite de upload para Decretos, Editais e Relatórios Municipais (50MB)
    client_max_body_size 50M;

    # Encaminhamento para o Next.js
    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Cache de arquivos estáticos gerados pelo Next.js
    location /_next/static {
        proxy_pass http://web:3000;
        proxy_cache_bypass $http_upgrade;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /public {
        proxy_pass http://web:3000;
        add_header Cache-Control "public, max-age=86400";
    }

    location = /favicon.ico {
        proxy_pass http://web:3000;
        access_log off;
        log_not_found off;
    }
}
